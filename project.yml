name: EmusLink
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
# Personal settings (team, bundle ID, module name) live in
# Config/Local.xcconfig, see Config/Local.xcconfig.example.
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
targets:
  EmusLink:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - EmusLinkTests
    sources:
      - path: EmusLink
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # CarPlay entitlement in the simulator only. On an iPhone it only works once
        # Apple has approved the "Driving Task" entitlement for your account:
        # then remove the [sdk=...] restriction.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": EmusLink/CarPlay.entitlements
    info:
      path: EmusLink/Info.plist
      properties:
        CFBundleDisplayName: EmusLink
        # XcodeGen writes 1.0 (1) here unless told otherwise.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, nl]
        EmusDefaultModuleName: $(DEFAULT_MODULE_NAME)
        ABRPDefaultAPIKey: $(ABRP_API_KEY)
        ABRPDefaultUserToken: $(ABRP_USER_TOKEN)
        # Only HTTPS from the system: no export compliance question per TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central, location]
        NSBluetoothAlwaysUsageDescription: "EmusLink reads the battery data from the EMUS BMS over Bluetooth."
        NSLocationWhenInUseUsageDescription: "Speed and distance for the consumption per km, and the position for ABRP."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Keep tracking consumption and sending the position to ABRP in the background."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
  EmusLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EmusLinkTests
    dependencies:
      - target: EmusLink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        SWIFT_VERSION: "5.0"
