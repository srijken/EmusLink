name: EmusLink
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
# Personal settings (team, bundle ID, module name) live in
# Config/Local.xcconfig, see Config/Local.xcconfig.example.
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
# The version for the app and its widget extension (they must match).
settings:
  base:
    MARKETING_VERSION: "0.4"
    CURRENT_PROJECT_VERSION: "4"
targets:
  EmusLink:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - EmusLinkTests
    sources:
      - path: EmusLink
        excludes:
          - "*.entitlements"
      - path: Shared
    dependencies:
      - target: EmusLinkWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # iCloud key-value storage (backup of the learned data) on every build.
        CODE_SIGN_ENTITLEMENTS: EmusLink/EmusLink.entitlements
        # CarPlay entitlement in the simulator only (CarPlay.entitlements also holds iCloud).
        # On an iPhone it only works once Apple has approved the "Driving Task" entitlement
        # for your account: then add it to EmusLink.entitlements and remove this line.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": EmusLink/CarPlay.entitlements
    info:
      path: EmusLink/Info.plist
      properties:
        CFBundleDisplayName: EmusLink
        # XcodeGen writes 1.0 (1) here unless told otherwise.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, nl]
        EmusDefaultModuleName: $(DEFAULT_MODULE_NAME)
        ABRPDefaultAPIKey: $(ABRP_API_KEY)
        ABRPDefaultUserToken: $(ABRP_USER_TOKEN)
        # Only HTTPS from the system: no export compliance question per TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central, location]
        NSSupportsLiveActivities: true
        NSBluetoothAlwaysUsageDescription: "EmusLink reads the battery data from the EMUS BMS over Bluetooth."
        NSLocationWhenInUseUsageDescription: "Speed and distance for the consumption per km, and the position for ABRP."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Keep tracking consumption and sending the position to ABRP in the background."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
  # Live Activity while driving (lock screen, Dynamic Island, CarPlay). iOS 18 for the
  # CarPlay/Watch size; on iOS 17 the app runs without it.
  EmusLinkWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: EmusLinkWidgets
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: EmusLinkWidgets/Info.plist
      properties:
        CFBundleDisplayName: EmusLink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, nl]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  EmusLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EmusLinkTests
    dependencies:
      - target: EmusLink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        SWIFT_VERSION: "5.0"
